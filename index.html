<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>ETH live price by cv0x</title>
</head>
<body>
    <div class="stage">
        <div class="card">
            <svg id="eth-logo" viewBox="0 0 512 512" aria-label="Ethereum logo">
                <circle cx="256" cy="256" r="256" fill="var(--eth-color)"></circle>
                <polygon points="256,116 170,258 256,220" fill="#fff"></polygon>
                <polygon points="256,116 342,258 256,220" fill="#fff" fill-opacity="0.6"></polygon>
                <polygon points="170,258 256,220 256,310" fill="#fff" fill-opacity="0.6"></polygon>
                <polygon points="342,258 256,220 256,310" fill="#fff" fill-opacity="0.2"></polygon>
                <polygon points="170,275 256,326 256,395" fill="#fff"></polygon>
                <polygon points="342,275 256,326 256,395" fill="#fff" fill-opacity="0.6"></polygon>
            </svg>
            <div class="eth-backgound"></div>
            <p id="eth-price">Loading...</p>
            <svg id="eth-chart" class="graf" viewBox="0 0 400 220" preserveAspectRatio="none" aria-label="Ethereum 7d chart">
                <polyline id="eth-chart-line" fill="none" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
            </svg>
        </div>
    </div>
    <div class="donate">
        <i class='bx bxs-heart' id="donate-icon"></i>
        <div class="donate-box">
            <h3>Support the creator</h3>
            <img src="ethsupport.png" alt="Support the creator - ETH QR code">
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
